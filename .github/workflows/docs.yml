name: docs

# Build and validate the documentation. Publication to the OBS documentation
# mirror is a maintainer step and is not performed by CI.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/gsMap/config/**"
      - "src/gsMap/cli.py"
      - "pyproject.toml"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "docs/**"
      - "src/gsMap/config/**"
      - "src/gsMap/cli.py"
      - "pyproject.toml"
      - "CHANGELOG.md"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # `doc` is a dependency-group (PEP 735); torch is pinned to the CPU
          # wheel since the docs runner has no GPU.
          uv pip install --system --torch-backend=cpu . --group doc

      - name: Build documentation
        run: |
          python docs/tools/generate_cli_reference.py
          python docs/tools/generate_downloads.py --catalog docs/resource_catalog.json
          git diff --exit-code -- docs/source/cli_reference.md
          git diff --exit-code -- docs/source/downloads.md
          sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Upload HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
