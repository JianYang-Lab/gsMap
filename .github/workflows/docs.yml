name: docs

# Build and validate the documentation on pull requests; on main (or a manual run on
# main) also publish it to GitHub Pages: https://jianyang-lab.github.io/gsMap/
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/gsMap/config/**"
      - "src/gsMap/cli.py"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/gsMap/config/**"
      - "src/gsMap/cli.py"
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch: # Manual rebuild and publication

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # `doc` is a dependency-group (PEP 735); torch is pinned to the CPU
          # wheel since the docs runner has no GPU.
          uv pip install --system --torch-backend=cpu . --group doc

      - name: Build documentation
        run: |
          python docs/tools/generate_cli_reference.py
          python docs/tools/generate_downloads.py --catalog docs/resource_catalog.json
          git diff --exit-code -- docs/source/cli_reference.md
          git diff --exit-code -- docs/source/downloads.md
          sphinx-build -W --keep-going -b html docs/source docs/build/html
          rm -rf docs/build/html/.doctrees docs/build/html/.buildinfo
          touch docs/build/html/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - name: Upload HTML for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
